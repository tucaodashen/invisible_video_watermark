name: 🚀 Manual Release Build

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: '📜 Release 更新日志'
        required: true

jobs:
  build:
    name: Test → Build → Release
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install uv
        run: pip install uv

      - name: 🔧 Sync dependencies
        run: uv sync

      - name: 📖 Read version
        id: version
        shell: python
        run: |
          import re
          with open("BasicSystem/const.py", encoding="utf-8") as f:
              content = f.read()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', content)
          v = m.group(1) if m else "v0.0.0"
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\n")
          print(f"Version: {v}")

      - name: 🧪 Run tests
        run: uv run python -m pytest tests/ -v --tb=short

      - name: 🔨 Build LogServer
        working-directory: make
        run: |
          uv run python -m nuitka --assume-yes-for-downloads --standalone --show-progress --show-memory --output-filename="LogServer" --main="../LogServer/main.py" --company-name="PraySoftware" --file-version="0.0.0.1" --product-version="0.0.0.1" --file-description="NetworkLogger" --onefile --remove-output --product-name="LogServer"

      - name: 🔨 Build AobaUpdater
        working-directory: make
        run: |
          uv run python -m nuitka --assume-yes-for-downloads --standalone --show-progress --show-memory --output-filename="AobaUpdater" --main="../updater/aoba_updater.py" --windows-icon-from-ico="aoba.ico" --company-name="PraySoftware" --product-name="AobaUpdater" --file-version="0.0.0.1" --product-version="0.0.0.1" --file-description="SoftwareUpdater" --onefile --remove-output

      - name: 🔨 Build Main App
        working-directory: make
        run: |
          uv run python -m nuitka --assume-yes-for-downloads --standalone --show-progress --show-memory --output-filename="IVW_Omicron" --main="../MainEntrance.py" --company-name="PraySoftware" --file-version="0.0.0.1" --product-version="0.0.0.1" --file-description="InvisibleWatermarkMaker" --remove-output --product-name="IVWNext" --output-dir="output" --report="compile_log" --windows-icon-from-ico="pw.ico" --enable-plugins=pyside6 --lto=yes

      - name: 📁 Assemble release package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path Release\logs
          New-Item -ItemType Directory -Force -Path Release\dumps
          New-Item -ItemType Directory -Force -Path Release\download
          New-Item -ItemType Directory -Force -Path Release\preset

          $dist = Get-ChildItem -Path make\output -Directory -Filter "*.dist" |
              Where-Object { $_.Name -notmatch "LogServer|AobaUpdater" } |
              Select-Object -First 1
          if (-not $dist) { Write-Error "No main app .dist folder found"; exit 1 }
          Write-Host "Found dist: $($dist.FullName)"
          Copy-Item -Recurse -Force "$($dist.FullName)\*" Release\

          Copy-Item -Recurse -Force assets Release\assets
          Copy-Item -Force make\LogServer.exe Release\LogServer.exe
          Copy-Item -Force make\AobaUpdater.exe Release\AobaUpdater.exe

      - name: 📦 Package zip
        shell: powershell
        run: |
          Compress-Archive -Path Release\* -DestinationPath Windows_amd64.zip

      - name: ⬆️ Upload compile log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile_log
          path: make/compile_log
          retention-days: 7

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: |
            Windows_amd64.zip
            make/AobaUpdater.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
