name: 🚀 Manual Windows Release Build and Upload

# 1. 触发条件：设置为手动触发
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '📌 发布的版本标签 (例如：v1.2.3)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: '📝 Release 标题'
        required: true
        default: 'Automated Build Release'
      changelog:
        description: '📜 Release 更新日志/描述'
        required: true
        default: 'Initial automated release.'

# 2. 定义 Job
jobs:
  build_and_release:
    name: Build, Zip, and Publish Release
    # 2.1. 运行环境：使用 Windows Runner
    runs-on: windows-latest 
    
    steps:
      # 2.2. 检出代码
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        
      # 2.3. (假设) 安装 UV (您需要根据实际工具调整这部分)
      # ⚠️ 注意：这里的 UV 是一个占位符。如果 UV 是一个 Python 包 (如 Uvicorn)，
      # 您需要先安装 Python 并使用 pip。请根据您的“UV”工具的实际安装方式进行修改。
      - name: 🛠️ Install UV/Build Environment (Placeholder)
        run: |
          echo "Installing UV or required build tools..."
          # 替换为实际安装命令，例如：
          # pip install uvicorn  
          # 或者：
          # choco install <your-tool>
          # 或者：
          # .\setup_uv.bat
        shell: powershell
        
      # 2.4. 运行您的构建脚本
      - name: ⚙️ Run Automake Build Script
        # 确保路径正确：仓库根目录下的 make 文件夹中的 automake.bat
        run: .\make\automake.bat
        # ⚠️ 注意：批处理文件在 PowerShell 中也可以运行，但如果脚本依赖 CMD 特性，最好使用 cmd
        shell: cmd 
        
      # 2.5. 打包 Release 文件
      - name: 📦 Create Windows_amd64.zip
        # 使用 Tar 命令在 Windows 上创建 zip 压缩包
        run: |
          # 压缩 MainEntrance.dist 目录下的所有内容 (不是目录本身)
          # 目标路径：make/output/MainEntrance.dist/
          # 压缩文件路径：make/Windows_amd64.zip
          tar -a -c -f make/Windows_amd64.zip -C make/output/MainEntrance.dist .
          
      # 2.6. 上传 Artifact (compile_log)
      - name: ⬆️ Upload Compilation Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile_log
          path: make/compile_log
          # 保留 7 天
          retention-days: 7
          
      # 2.7. 创建并发布 Release
      - name: 🚀 Publish New Release
        uses: softprops/action-gh-release@v2
        with:
          # 从手动输入的参数获取标签名、标题和描述
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          body: ${{ github.event.inputs.changelog }}
          # 将两个附件添加到 Release 中
          files: |
            make/AobaUpdater.exe
            make/Windows_amd64.zip
            
        env:
          # 使用 GITHUB_TOKEN 进行认证
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}